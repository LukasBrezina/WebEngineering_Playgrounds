services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      WIKIPEDIA_API_URL: ${WIKIPEDIA_API_URL:-https://en.wikipedia.org/w/api.php}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:4173,http://localhost:5173}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
