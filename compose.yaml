services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-web}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-web}
      POSTGRES_DB: ${POSTGRES_DB:-web}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      WIKIPEDIA_API_URL: ${WIKIPEDIA_API_URL:-https://en.wikipedia.org/w/api.php}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:4173,http://localhost:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-web}:${POSTGRES_PASSWORD:-web}@db:5432/${POSTGRES_DB:-web}
    # migrate + seed before the server starts (server only starts if both succeed)
    command:
      [
        'sh',
        '-c',
        'node dist/db/migrate.js && node dist/db/seed.js && node dist/server.js',
      ]
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
